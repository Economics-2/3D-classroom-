<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D সৌরজগত: বল ও পৃথিবীর গতি</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Hind Siliguri', sans-serif; }
        
        /* UI Overlay Design */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: #4ade80; }
        p { font-size: 0.9rem; color: #cbd5e1; }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-family: 'Hind Siliguri', sans-serif;
        }

        .btn-speed { background: #3b82f6; color: white; }
        .btn-slow { background: #ef4444; color: white; }
        button:hover { opacity: 0.8; transform: scale(1.05); }

        .info-badge {
            margin-top: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🌏 পৃথিবী ও মহাকাশ</h1>
        <p>মাউস দিয়ে ড্র্যাগ করে ঘুরিয়ে দেখুন। পৃথিবী সূর্যের চারদিকে ঘোরে (বার্ষিক গতি) এবং নিজের অক্ষে ঘোরে (আহ্নিক গতি)।</p>
        
        <div class="info-badge">
            <span style="color: yellow;">●</span> সূর্য | 
            <span style="color: #3b82f6;">●</span> পৃথিবী | 
            <span style="color: #cbd5e1;">●</span> চাঁদ
        </div>

        <div class="controls">
            <button class="btn-speed" onclick="changeSpeed(1)">গতি বাড়ান (Force +)</button>
            <button class="btn-slow" onclick="changeSpeed(-1)">গতি কমান (Force -)</button>
        </div>
        <p id="speed-display" style="margin-top:10px; font-weight:bold;">বর্তমান গতি: 1x</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        
        // Add Stars Background
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({color: 0xffffff});
        const starCount = 5000;
        const starPositions = [];
        for(let i=0; i<starCount; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starPositions.push(x, y, z);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333); // Soft light
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xffffff, 2, 300); // Sun light
        scene.add(pointLight);

        // --- OBJECTS ---

        // 2. The Sun
        const sunGeometry = new THREE.SphereGeometry(8, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Emissive yellow
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Glow effect for Sun (Simple separate mesh)
        const glowGeo = new THREE.SphereGeometry(9, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.3 });
        const sunGlow = new THREE.Mesh(glowGeo, glowMat);
        scene.add(sunGlow);

        // 3. The Earth System (Parent container to handle orbit)
        const earthOrbitNode = new THREE.Object3D();
        scene.add(earthOrbitNode);

        // The Earth Mesh
        const earthGeometry = new THREE.SphereGeometry(3, 32, 32);
        // Simple Phong material to react to light
        const earthMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x2233ff, 
            emissive: 0x112244,
            specular: 0x111111,
            shininess: 10
        }); 
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.position.x = 30; // Distance from sun
        earthOrbitNode.add(earth);

        // 4. The Moon
        const moonGeometry = new THREE.SphereGeometry(0.8, 32, 32);
        const moonMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        // Moon sits relative to Earth, but we need a pivot point
        const moonOrbitNode = new THREE.Object3D();
        moonOrbitNode.position.x = 30; // Same as earth
        earthOrbitNode.add(moonOrbitNode); // Add to earth's orbital path system
        moon.position.x = 6; // Distance from earth
        moonOrbitNode.add(moon);


        // --- ANIMATION LOGIC ---
        
        let speedMultiplier = 1;
        let angle = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Rotate Sun (Visual effect)
            sun.rotation.y += 0.004;

            // Earth Rotation (Day/Night cycle) - আহ্নিক গতি
            earth.rotation.y += 0.02 * speedMultiplier;

            // Earth Revolution around Sun - বার্ষিক গতি
            // We rotate the parent container
            earthOrbitNode.rotation.y += 0.005 * speedMultiplier;

            // Moon Revolution around Earth
            // Since moonOrbitNode is inside earthOrbitNode, it follows earth.
            // We just need to rotate it on its own axis relative to earth.
            moonOrbitNode.rotation.y += 0.03 * speedMultiplier;
            moonOrbitNode.position.copy(earth.position); // Ensure pivot stays with earth

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- INTERACTIVITY ---
        
        function changeSpeed(val) {
            if(val === 1) {
                speedMultiplier += 0.5;
            } else {
                if(speedMultiplier > 0.5) speedMultiplier -= 0.5;
            }
            document.getElementById('speed-display').innerText = "বর্তমান গতি: " + speedMultiplier + "x";
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
