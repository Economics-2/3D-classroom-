<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরিবেশ ও জলবায়ু সিমুলেটর</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-clean: #87CEEB;
            --sky-dirty: #5d5d5d;
            --sun-happy: #FDB813;
            --sun-angry: #ff4500;
            --water-level-normal: 10%;
            --water-level-high: 30%;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0f9ff;
        }

        /* --- UI PANEL --- */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 100;
            width: 300px;
            border: 2px solid #2563eb;
        }

        h2 { margin: 0 0 10px 0; color: #1e3a8a; font-size: 1.5rem; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.2s;
            color: white;
        }
        button:active { transform: scale(0.95); }

        .btn-tree { background: #10b981; }
        .btn-factory { background: #ef4444; }
        .btn-reset { background: #6b7280; margin-top: 10px; width: 100%; }

        .stats { margin-top: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }

        /* Thermometer Bar */
        .meter-container {
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid #d1d5db;
        }
        .meter-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
            transition: width 0.5s ease;
        }

        /* --- SCENE --- */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, var(--sky-clean), #e0f7fa);
            transition: background 1s ease;
            overflow: hidden;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: var(--sun-happy);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(253, 184, 19, 0.6);
            transition: all 1s ease;
        }

        /* Clouds/Smog */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            transition: background 1s;
        }

        /* Land */
        .land {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: #4ade80; /* Green grass */
            border-top-left-radius: 50% 20%;
            border-top-right-radius: 50% 20%;
            transition: background 1s ease;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px;
        }

        /* Water (Sea Level) */
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 10%; /* Starts low */
            background: rgba(37, 99, 235, 0.7);
            z-index: 20;
            transition: height 1s ease-in-out;
            border-top: 2px solid rgba(255,255,255,0.5);
        }

        /* Objects on Land */
        .objects-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap-reverse;
            justify-content: center;
            width: 80%;
            position: relative;
            z-index: 11;
            margin-bottom: 20px;
        }

        .item {
            font-size: 3rem;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Smoke effect for factories */
        .smoke {
            position: absolute;
            top: -20px;
            left: 10px;
            width: 10px;
            height: 10px;
            background: gray;
            border-radius: 50%;
            opacity: 0;
            animation: rise 2s infinite;
        }

        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes rise { 
            0% { opacity: 0.8; transform: translateY(0) scale(1); } 
            100% { opacity: 0; transform: translateY(-30px) scale(2); } 
        }

        /* Message Box */
        .message-box {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #374151;
            z-index: 30;
            text-align: center;
            min-width: 300px;
        }

    </style>
</head>
<body>

    <div class="control-panel">
        <h2>🌍 পরিবেশ সিমুলেটর</h2>
        <p>তোমার কাজের প্রভাব দেখো:</p>
        
        <div class="stats">
            <div class="stat-row">
                <span>🌡️ তাপমাত্রা:</span>
                <span id="temp-val">স্বাভাবিক (25°C)</span>
            </div>
            <div class="meter-container">
                <div class="meter-fill" id="temp-bar"></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-tree" onclick="addItem('tree')">🌱 গাছ লাগাই</button>
            <button class="btn-factory" onclick="addItem('factory')">🏭 কারখানা বানাই</button>
        </div>
        <button class="btn-reset" onclick="resetSim()">🔄 আবার শুরু করো</button>
    </div>

    <div class="scene" id="scene-bg">
        <div class="sun" id="sun"></div>
        
        <div class="cloud" style="top: 10%; left: 20%; width: 100px; height: 40px;"></div>
        <div class="cloud" style="top: 15%; right: 10%; width: 120px; height: 50px;"></div>

        <div class="land" id="land">
            <div class="objects-container" id="objects-area">
                </div>
        </div>
        
        <div class="water" id="water"></div>

        <div class="message-box" id="msg-box">
            পরিবেশ এখন সুন্দর ও বাসযোগ্য 😊
        </div>
    </div>

    <script>
        let pollutionScore = 50; // 0 = Best, 100 = Worst (Global Warming)
        const objectsArea = document.getElementById('objects-area');
        const sceneBg = document.getElementById('scene-bg');
        const sun = document.getElementById('sun');
        const water = document.getElementById('water');
        const land = document.getElementById('land');
        const tempBar = document.getElementById('temp-bar');
        const tempVal = document.getElementById('temp-val');
        const msgBox = document.getElementById('msg-box');

        // Initial Setup
        updateScene();

        function addItem(type) {
            const el = document.createElement('div');
            el.className = 'item';
            
            if (type === 'tree') {
                if(pollutionScore > 0) pollutionScore -= 10;
                el.innerHTML = '🌲';
            } else {
                if(pollutionScore < 100) pollutionScore += 10;
                el.innerHTML = '🏭<div class="smoke"></div>';
            }

            // Limit items to prevent overflow visual mess
            if(objectsArea.children.length > 8) {
                objectsArea.removeChild(objectsArea.firstChild);
            }
            
            objectsArea.appendChild(el);
            updateScene();
        }

        function updateScene() {
            // Update Meter
            tempBar.style.width = pollutionScore + '%';

            // 1. Temperature Text Logic
            let tempC = 20 + (pollutionScore / 100 * 20); // Maps 20C to 40C
            tempVal.innerText = tempC.toFixed(1) + "°C";

            // 2. Visual Changes based on Pollution Score
            if (pollutionScore < 40) {
                // Good Environment
                sceneBg.style.background = "linear-gradient(to bottom, #87CEEB, #e0f7fa)"; // Blue Sky
                sun.style.backgroundColor = "#FDB813"; // Yellow Sun
                sun.style.boxShadow = "0 0 40px rgba(253, 184, 19, 0.6)";
                land.style.background = "#4ade80"; // Green Grass
                water.style.height = "10%"; // Low Sea Level
                water.style.background = "rgba(37, 99, 235, 0.7)";
                msgBox.innerText = "পরিবেশ এখন সুন্দর ও বাসযোগ্য 😊";
                msgBox.style.color = "green";

            } else if (pollutionScore >= 40 && pollutionScore < 75) {
                // Warning Phase
                sceneBg.style.background = "linear-gradient(to bottom, #a8c0ce, #e6e6e6)"; // Hazy Sky
                sun.style.backgroundColor = "#f59e0b"; // Orange Sun
                land.style.background = "#a3e635"; // Yellowish Grass
                water.style.height = "20%"; // Rising Sea Level
                msgBox.innerText = "সতর্কতা: তাপমাত্রা বাড়ছে! ⚠️";
                msgBox.style.color = "#d97706";

            } else {
                // Danger/Global Warming Phase
                sceneBg.style.background = "linear-gradient(to bottom, #5d5d5d, #a3a3a3)"; // Dark Smoggy Sky
                sun.style.backgroundColor = "#ef4444"; // Red Angry Sun
                sun.style.boxShadow = "0 0 60px rgba(239, 68, 68, 0.8)";
                land.style.background = "#d97706"; // Dried Earth
                water.style.height = "45%"; // Flooding Sea Level
                water.style.background = "rgba(20, 50, 100, 0.9)"; // Dark Water
                
                msgBox.innerText = "বিপদ! বরফ গলে বন্যা হচ্ছে! 🌊🆘";
                msgBox.style.color = "red";
            }
            
            // Cloud Color change
            const clouds = document.querySelectorAll('.cloud');
            clouds.forEach(c => {
                c.style.background = pollutionScore > 60 ? '#9ca3af' : 'white';
            });
        }

        function resetSim() {
            pollutionScore = 50;
            objectsArea.innerHTML = '';
            updateScene();
        }

    </script>
</body>
</html>
